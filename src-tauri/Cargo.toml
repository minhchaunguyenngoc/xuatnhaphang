[package]
name = "app"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Bản dev mặc định biên dịch cả SQLite (C bundled) ở opt-level 0 nên chậm hơn
# bản release nhiều lần — lag khi chạy `tauri dev` phần lớn đến từ đây chứ
# không phải từ code. Tối ưu các crate phụ thuộc ở mức cao nhất nhưng giữ crate
# của mình ở mức 1 để vẫn biên dịch lại nhanh khi sửa code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
